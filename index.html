<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chrono Spies</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- UI Overlay -->
        <div id="hud" class="hidden">
            <div id="top-left-hud">
                <div id="scoreDisplay">Kills: <span id="killsDisplay">0</span></div>
                <div id="timeDisplay">Time: <span id="timeSurvived">0</span>s</div>
                <div id="itemDisplay">Current Weapons: <span id="currentWeapons">None</span></div>
            </div>
            <div id="top-right-hud">
                <div id="currencyDisplay">$<span id="moneyDisplay">0</span></div>
                <div id="healthBarContainer">
                    <div id="healthBarFill"></div>
                    <span id="healthText">1 HP</span>
                </div>
            </div>
        </div>

        <!-- Main Menu -->
        <div id="mainMenu" class="overlay">
            <h1>CHRONO SPIES</h1>
            <p>Select your avatar to start: (Use Arrow Keys + Enter)</p>
            <div class="avatar-selection" id="avatarSelection">
                <!-- Standard Avatars -->
                <button class="avatar-btn" data-unlocked="true" data-type="emoji" data-id="alien">👽</button>
                <button class="avatar-btn" data-unlocked="true" data-type="emoji" data-id="robot">🤖</button>
                <button class="avatar-btn" data-unlocked="true" data-type="emoji" data-id="ghost">👻</button>
                <button class="avatar-btn" data-unlocked="true" data-type="emoji" data-id="cowboy">🤠</button>
                <button class="avatar-btn" data-unlocked="true" data-type="image" data-id="cat"><img src="black_cat.png" style="width:100%;height:100%;border-radius:5px;object-fit:cover;"></button>
                <button class="avatar-btn" data-unlocked="true" data-type="emoji" data-id="wizard">🧙</button>
                <button class="avatar-btn" data-unlocked="true" data-type="emoji" data-id="ninja">🥷</button>
                <button class="avatar-btn" data-unlocked="true" data-type="emoji" data-id="zombie">🧟</button>
                <button class="avatar-btn" data-unlocked="true" data-type="emoji" data-id="vampire">🧛</button>
                <button class="avatar-btn" data-unlocked="true" data-type="emoji" data-id="unicorn">🦄</button>
                
                <!-- Premium Skins Container (Populated via JS) -->
            </div>
            <div class="controls-info">
                Use Arrow Keys or WASD to move.<br>
                Find items to unlock weapons.<br>
                Survive the escalating spy threat!
            </div>
            <div id="secretDevBtn" style="position:absolute; bottom:10px; left:10px; width:20px; height:20px; background-color: #0d1117; cursor:pointer;"></div>
        </div>

        <!-- Shop Menu -->
        <div id="shopMenu" class="overlay hidden">
            <h1>UPGRADE SHOP</h1>
            <p>You have $<span id="shopMoney">0</span></p>
            
            <div class="shop-tabs">
                <button id="tabWeapons" class="tab-btn active">Weapons & Armor</button>
                <button id="tabSkins" class="tab-btn">Premium Skins</button>
            </div>

            <div id="shopWeapons" class="shop-content active">
                <div class="shop-grid" id="weaponsGrid">
                    <!-- Populated via JS -->
                </div>
            </div>

            <div id="shopSkins" class="shop-content">
                <div class="shop-grid" id="skinsGrid">
                    <!-- Populated via JS -->
                </div>
            </div>

            <button id="resumeBtn">Resume Game</button>
        </div>

    </div>
    
    <script src="game.js"></script>
</body>
</html>
